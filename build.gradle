plugins {
    id 'java'
}

version = '0.1.7'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.87'
}

jar {
    manifest {
        attributes 'Main-Class': 'diff.notcompatible.c.bot.driver'
    }
}
